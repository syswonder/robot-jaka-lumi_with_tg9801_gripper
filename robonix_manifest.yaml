# Robonix deployment for the JAKA Lumi mobile manipulator with a TG-9801
# gripper. Committed form: every package is referenced by its repository URL.
# On a machine with sibling checkouts, robonix_manifest.local.yaml (gitignored)
# substitutes `path:` entries so build and boot use the working trees directly.
manifestVersion: 1
name: robonix-jaka-lumi_with_tg9801_gripper

catalog:
  name: robonix.robot.jaka.lumi_with_tg9801_gripper
  version: 0.1.0
  description: Robonix deployment for the JAKA Lumi mobile manipulator with TG-9801 gripper.
  license: Apache-2.0
  tags: [robot, deploy, mobile_manipulator, jaka, lumi, gripper]
  maintainers:
    - Felix Xi <xi.lifeng@qq.com>

env:
  ROS_DOMAIN_ID: "0"
  RMW_IMPLEMENTATION: rmw_zenoh_cpp
  ROBONIX_ZENOH_MODE: client
  ROBONIX_ZENOH_ROUTER: tcp/0.0.0.0:7447
  # Host-side provider code runs on the deployment venv: the generated gRPC
  # bindings need grpcio >= 1.76, while the system python3 pins an older one
  # for JetPack. ${PWD} is expanded by `rbnx boot` at startup, so always invoke
  # boot from this directory (start.sh does).
  PATH: "${PWD}/.venv/bin:${PATH}"

system:
  atlas:
    listen: 0.0.0.0:50051
  soma:
    listen: 0.0.0.0:50091
    # The ROS 2 runtime reader needs rclpy + sensor_msgs + nav_msgs; the boot
    # shell may not have ROS sourced, so wrap it in bash. No $VAR here: rbnx
    # expands those itself.
    runtime_reader_command:
      - bash
      - -c
      - "source /opt/ros/humble/setup.bash && exec python3 -u {script} {config}"
  executor:
    listen: 0.0.0.0:50061
  pilot:
    listen: 0.0.0.0:50071
    vlm:
      # Provided by the environment at boot (shell, systemd, or a gitignored
      # local manifest). Never commit a real key here.
      upstream: ${VLM_BASE_URL}     # e.g. https://api.example.com/v1
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}           # e.g. deepseek-v4-flash
  vitals:
    listen: 0.0.0.0:50093
  liaison:
    listen: 0.0.0.0:50081
  # Scene: the semantic + geometric live map behind Pilot's environment
  # questions. It is not a builtin binary, so it is resolved from the
  # robonix source tree (`system/scene`) registered by `rbnx setup`, and it
  # runs natively on the host because that is where the JetPack CUDA stack
  # and ROS 2 are.
  scene:
    manifest: package_manifest.jetson-native.yaml
    config:
      # Two Gemini 2L units are registered; pin the RGB-D streams, the
      # intrinsics and the frame to one physical camera so they cannot mix.
      camera_provider_id: waist_camera
      camera_frame: waist_camera_color_optical_frame
      base_frame: base_link
      web_port: 50107
      # Native has no rerun-sdk and no browser bundle, so the 3D/2D map pages
      # stay off. The camera, maps and logs pages are served either way.
      web_viewer: "off"
      pose_max_age_s: 2.0
      perception:
        profile: lite
      # The Orbbec primitive publishes camera_info, which Scene does not read:
      # it consumes primitive/camera/intrinsics and waits (never guesses K)
      # when that contract is absent. The per-unit fallback lives in the
      # gitignored local manifest; the real fix is to declare the intrinsics
      # contract on the camera primitive and drop the fallback.

primitive:
  - name: robot_description
    url: https://github.com/syswonder/primitive-robot-description-rbnx
    branch: main
    # Native mode: robot_state_publisher runs on the host (no docker), and it
    # is what turns /joint_states into the TF tree.
    manifest: package_manifest.native.yaml

  - name: jaka_arm
    url: https://github.com/syswonder/primitive-jaka-mini_with_tg9801_gripper-arm_gripper-rbnx
    branch: lumi
    config:
      # Lumi's cabinet address, NOT the mini's 10.5.5.100.
      ip: 192.168.10.90
      # App account the provider uses to start the extended-IO slave by itself.
      # Fill in the password for your site; it is never committed.
      web_user: jakazu7admin
      web_password: ${JAKA_WEB_PASSWORD}   # App account password
      # SDK account for the gRPC session. The ext-IO calls abort on a legacy
      # session, so the provider has no built-in password default any more:
      # leave this empty and the gripper is silently disabled.
      sdk_user: jaka_sdk
      sdk_password: ${JAKA_SDK_PASSWORD}   # SDK account password
      motion_enabled: true
      joint_speed_rad_s: 0.3
      linear_speed_mm_s: 30.0
      gripper_force: 30
      gripper_speed: 1100
      state_publish_hz: 50.0
      # The arm sits on the waist, so Cartesian poses belong to the arm base
      # frame, which is the parent of link_a1 in the deployment URDF.
      base_frame: link_2
      # Exit homing: open the gripper, then park in the factory packing pose
      # before power-off. Only honoured while motion_enabled is true.
      # J = [0, 120, -120, 0, -90, 0] deg; TCP (-22.1, -6.0, 292.0) mm,
      # rpy (0, 90, 0) deg. The vendor packs the robot in this folded pose;
      # read back from the controller on 2026-10-29.
      shutdown_home_joints: [0.0, 2.0943951, -2.0943951, 0.0, -1.5707963, 0.0]

  - name: head_camera
    url: https://github.com/syswonder/primitive-orbbec-camera-rbnx
    branch: main
    config:
      launch_file: gemini2L.launch.py
      camera_name: head_camera
      # Two identical RGB-D units: pin the head one by serial so a reboot
      # cannot silently swap the mapping camera for the torso one.
      serial_number: ${LUMI_HEAD_CAMERA_SN}   # `lsusb -d 2bc5:` (two identical Gemini 2L units)
      depth_registration: true
      # Manual 5.1.5: color 1280x800@30 or 1280x720@60; depth 1280x800@30 or
      # 640x400@60. Mapping runs on 1280x720 + 640x400 to leave CPU for RTAB-Map.
      color_width: 1280
      color_height: 720
      color_fps: 30
      depth_width: 640
      depth_height: 400
      depth_fps: 30
      sentinel_timeout_s: 30.0

  # The second Gemini 2L sits on the base panel. It is not a mapping input any
  # more (mapping runs on the MID-360), but both cameras stay in the stack for
  # future scene / calibration work.
  - name: waist_camera
    url: https://github.com/syswonder/primitive-orbbec-camera-rbnx
    branch: main
    config:
      launch_file: gemini2L.launch.py
      camera_name: waist_camera
      # Pinned by serial for the same reason as the head unit.
      serial_number: ${LUMI_WAIST_CAMERA_SN}
      depth_registration: true
      color_width: 1280
      color_height: 720
      color_fps: 30
      depth_width: 640
      depth_height: 400
      depth_fps: 30
      sentinel_timeout_s: 30.0

  - name: lumi_chassis
    url: https://github.com/syswonder/primitive-jaka-lumi-chassis-rbnx
    branch: main
    config:
      host: 192.168.10.10
      port: 31001
      # Drives the base: teleop and Nav2 both need it.
      motion_enabled: true
      odom_frame: odom
      base_frame: base_link
      publish_tf: true
      odom_rate_hz: 10.0
      max_linear_m_s: 0.3
      max_angular_rad_s: 0.5
      joy_rate_hz: 5.0
      twist_timeout_s: 0.5
      uuid: lumi

  - name: lumi_body
    url: https://github.com/syswonder/primitive-jaka-lumi-body-rbnx
    branch: main
    config:
      base_url: http://192.168.10.90:5000
      motion_enabled: true
      auto_enable: true
      state_publish_hz: 10.0
      joint_states_topic: /joint_states
      lift_max_mm: 360.0
      waist_max_deg: 140.0
      default_vel_pct: 10
      default_acc_pct: 10

  # Livox MID-360. The lidar keeps whatever address it was flashed with and
  # that differs per batch — Livox's default is 192.168.1.1XX, XX being the
  # last two digits of the S/N (this unit ...0305 answers on .105). Read the
  # real value off with Livox Viewer 2 or the SDK's `livox_lidar_info_get` and
  # export it; never commit one machine's address here.
  # boot order matters: mid360_imu defers until the lidar's /livox/imu is live.
  - name: mid360_lidar
    url: https://github.com/syswonder/primitive-livox-mid360-lidar-rbnx
    branch: main
    config:
      lidar_ip: ${LUMI_MID360_IP}
      # Empty = let the provider resolve the host NIC with
      # `ip route get <lidar_ip>`. Override only on a multi-NIC box where that
      # picks the wrong interface.
      host_ip: ""
      publish_freq: 10.0
      # Mounting pose of livox_frame in base_link (metres / radians). The CAD
      # suggests the connector faces base_link −Y (yaw −π/2), but driving the
      # robot showed the cloud rotated 180° from reality, so it is +π/2.
      # The provider publishes this TF edge itself, so keep it out of the URDF.
      parent_frame: base_link
      extrinsics:
        x: 0.098
        y: 0.0
        z: 0.190
        roll: 0.0
        pitch: 0.0
        yaw: 1.5708

  - name: mid360_imu
    url: https://github.com/syswonder/primitive-livox-mid360-imu-rbnx
    branch: main

service:
  - name: mapping
    url: https://github.com/syswonder/service-map-rbnx
    branch: main
    # No docker on the Jetson: the host already runs ROS 2 Humble plus
    # ros-humble-rtabmap-ros, so map natively instead of in a container.
    manifest: package_manifest.jetson-native.yaml
    config:
      params_file: config/rtabmap_params.yaml
      # 3D lidar SLAM plus the chassis pose as external odometry. The cameras
      # stay deployed for other uses but are deliberately not a mapping input:
      # rtabmap syncs rgb + depth + camera_info + scan_cloud, so one camera
      # dropping off USB freezes mapping completely (it happened: the grid just
      # stopped growing with nothing in the logs). The MID-360 alone is enough
      # for both mapping and localization and has no such coupling.
      sensor_providers:
        lidar3d: mid360_lidar
        odom: lumi_chassis

  - name: navigation
    url: https://github.com/syswonder/service-navigation-rbnx
    branch: main
    manifest: package_manifest.jetson-native.yaml
    config:
      params_file: config/nav2_params.yaml
      provider_ids:
        map: mapping
        odom: lumi_chassis
        # Live obstacle source for the costmaps (PointCloud2).
        scan_cloud: mid360_lidar
        # No `scan` / `scan_cloud` binding on purpose: see config/nav2_params.yaml
      # Required by the nav2 wrapper. 0.30 is the effective planar ceiling:
      # max_vel_x is 0.30 with max_vel_y 0.0, so the looser max_speed_xy 0.35
      # never applies; the chassis config caps at the same 0.3.
      dynamic_speed:
        max_linear_speed_mps: 0.3
        default_percentage: 100
